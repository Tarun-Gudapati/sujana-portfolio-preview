  <!-- The Enter click unlocks sound: a shutter click at once, then the opening
       rolls as soon as the first clip or its poster can show, with the sting's
       hit landing as the photo comes sharp and the name appears (styles.scss
       html.rolling: rack, name-in). Runs without waiting for the app; hero.ts
       and the sound service wait for the 'opened' event. Sounds: data.ts. -->
  <script>
    (function () {
      var root = document.documentElement;
      var gate = document.querySelector('div.gate');
      var video = document.querySelector('.hero__video');
      if (!root.classList.contains('gated') || !video) {
        root.classList.remove('gated', 'opening');
        return void gate.remove();
      }
      scrollTo(0, 0);

      var SHUTTER = { src: 'media/opening-shutter.mp3', gain: 0.5 };
      // hitAt: where the sting's hit sits in its file, in seconds.
      var STING = { src: 'media/opening-sting.mp3', gain: 0.6, hitAt: 1.2 };
      var HIT_AT = 1.35;
      var ROLL_MS = 2900;
      var MAX_HOLD_MS = 2500;

      var Ctx = window.AudioContext || window.webkitAudioContext;
      var audio = Ctx ? new Ctx() : null;

          .catch(function () {});
      }
      function play(sound, delay) {
        var buffer = audio && buffers[sound.src];
        if (!buffer) return;
        var source = audio.createBufferSource();
        var gain = audio.createGain();
        gain.gain.value = sound.gain;
        source.buffer = buffer;
        source.connect(gain).connect(audio.destination);
        source.start(audio.currentTime + Math.max(0, delay));

      load(STING);

      var ready = false, entered = false, withSound = false, rolled = false;
      function roll() {
        if (rolled || !ready || !entered) return;
        rolled = true;
        root.classList.remove('opening');
        root.classList.add('rolling');
        if (withSound) play(STING, HIT_AT - STING.hitAt);
        setTimeout(function () {
          root.classList.remove('rolling');
          document.dispatchEvent(new Event('opened'));
        }, ROLL_MS);
      }
      function onReady() {
        ready = true;
        roll();
      }
      function enter(sound) {
        if (entered) return;
        entered = true;
        withSound = sound;
        if (sound && audio) {
          audio.resume();
          play(SHUTTER, 0);
        }
        root.classList.remove('gated');
        setTimeout(function () { gate.remove(); }, 800);
        setTimeout(onReady, MAX_HOLD_MS);
        roll();
      }

      if (video.readyState >= 3) ready = true;
      video.addEventListener('canplay', onReady);
      var poster = new Image();
      poster.onload = onReady;
      poster.src = video.poster;

      var enterButton = gate.querySelector('.gate__enter');
      enterButton.addEventListener('click', function () { enter(true); });
      gate.querySelector('.gate__quiet').addEventListener('click', function () { enter(false); });

      function focusEnter() {
